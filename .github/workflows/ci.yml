name: ci

on:
  push:
    paths-ignore:
    - 'changelog.md'
    - 'license.md'
    - 'readme.md'
    - 'README.md'
    - 'Mdazor.Demo/**'
    branches: [main, master]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # stable, e.g. 0.1.0
      - '[0-9]+.[0-9]+.[0-9]+-*'    # prerelease, e.g. 0.1.0-rc.1
  pull_request:
    branches: [main, master]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      actions: write    # upload release assets

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Build, Test (Debug & Release), Publish (main/master only)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        dotnet tool install --global dotnet-releaser
        dotnet-releaser run --nuget-token "${{secrets.NUGET_TOKEN}}" --github-token "${{secrets.GITHUB_TOKEN}}" dotnet-releaser.toml