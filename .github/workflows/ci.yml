name: ci

on:
  push:
    paths-ignore:
    - 'changelog.md'
    - 'license.md'
    - 'readme.md'
    - 'README.md'
    - 'Mdazor.Demo/**'
    branches: [main, master]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'      # stable, e.g. 0.1.0
      - '[0-9]+.[0-9]+.[0-9]+-*'    # prerelease, e.g. 0.1.0-rc.1
  pull_request:
    branches: [main, master]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      actions: write    # upload release assets
      id-token: write   # OIDC token for NuGet trusted publishing

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: NuGet login (trusted publishing -> short-lived API key)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (NOT email)

    - name: Build, Test (Debug & Release), Publish (main/master only)
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        dotnet tool install --global dotnet-releaser
        dotnet-releaser run --nuget-token "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --github-token "${{secrets.GITHUB_TOKEN}}" dotnet-releaser.toml